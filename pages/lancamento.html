<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
    <header>

            <div class="head-container">
                <div class="header-left">
                    <img src="../img/logo-ford-256.png" alt="Logo Ford">  
                </div>
                

                <nav class="header-center">
                    <ul class="nav-links">
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="#">Lançamento</a></li>
                        <li><a href="./contato.html">Contato</a></li>
                    </ul>
                </nav>

                <div class="header-right">
                </div>
            </div>

    </header>

    <main class="lancamento-main">
        <div class="video-lancamento">
            <iframe width="1344" height="756" src="https://www.youtube.com/embed/vQsryuNmsL0" title="Ford Ranger 2022 | Gerações" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <div class="carros">
            <div class="carro-item">
                <img src="../img/XL Cabine.jpg" alt="Ford XLS">

                <div class="carro-item-details">
                    <input type="checkbox">
                    <a href="#">Ford Ranger XL</a>
                    <img src="../img/info.png" alt="info icon">
                </div>
            </div>

            <div class="carro-item">
                <img src="../img/xls 2.2 diesel.jpg" alt="Ford XLS">

                <div class="carro-item-details">
                    <input type="checkbox">
                    <a href="#">Ford Ranger XLS</a>
                    <img src="../img/info.png" alt="info icon">
                </div>
            </div>

            <div class="carro-item">
                <img src="../img/storm.jpg" alt="Ford XLS">

                <div class="carro-item-details">
                    <input type="checkbox">
                    <a href="#">Ford Ranger Storm</a>
                    <img src="../img/info.png" alt="info icon">
                </div>
            </div>
        </div>

        <button class="btn-comparar">Comparar Carros</button>
    </main>

    <footer>
        <nav>
            <div class="socials">

                <p>Redes Sociais</p>

                <div class="social-icon">
                    <a href="#">
                        <img src="../img/facebook-50.png" alt="facebook">
                    </a>
                    <a href="#">
                        <img src="../img/youtube-squared-50.png" alt="youtube">
                    </a>
                    <a href="#">
                        <img src="../img/instagram-logo-50.png" alt="instagram">
                    </a>
                </div>
            </div>

            <div class="ford-logo-footer">
                <img src="../img/ford-96.png" alt="">
            </div>
        </nav>
    </footer>

</body>
</html>
