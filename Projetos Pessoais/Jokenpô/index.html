<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokenpô</title>
    <link rel="stylesheet" href="style.css">
    <script src="backend.js" defer></script>
</head>
<body>

    <main>
        <div class="game-area-top">

            <div class="leaderboard-container">
                <p>1 - 1</p>
            </div>

            <div class="game-choices" id="game-choices">

                <div class="choice-container" id="cpu-choice">
                    <div class="choice-img no-choice" id="cpu-choice-img"></div>
                    <h2 id="cpu-choice-label">No Choice</h2>
                </div>

                <div class="choice-container player-choice-interactable" id="player-choice">
                    <div class="choice-img scissors-choice" id="player-choice-img"></div>
                    <h2 id="player-choice-label">Scissors</h2>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
