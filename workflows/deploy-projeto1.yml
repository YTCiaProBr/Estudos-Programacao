name: Deploy Projeto 1

on:
  push:
    branches: [ "main" ] # Altere para o nome da sua branch, se não for a main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Substitua 'nome-da-sua-pasta' pelo caminho exato do seu projeto
          path: './nome-da-sua-pasta' 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
