<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>

            <div class="head-container">
                <div class="header-left">
                    <img src="../img/logo-ford-256.png" alt="Logo Ford">  
                </div>
                

                <nav class="header-center">
                    <ul class="nav-links">
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="./lancamento.html">Lançamento</a></li>
                        <li><a href="#">Contato</a></li>
                    </ul>
                </nav>

                <div class="header-right">
                </div>
            </div>

    </header>

    <main class="contato-main">
        <div class="formulario">
            <div class="contato-image">
            <img src="../img/xls 2.2 diesel.jpg" alt="Ford Ranger XLS">
            </div>

            <div class="formulario-inputs">
                 <input type="text" placeholder="NOME*">
                 <input type="text" placeholder="E-MAIL*">
                 <input type="text" placeholder="TELEFONE*">
                 <input type="text" placeholder="MENSAGEM*">
                 <p>Tipo do contato</p>
                 <select name="TIPO DO CONTATO" id="formulario-contato">
                    <option value="elogio">ELOGIO</option>
                    <option value="reclamacao">RECLAMAÇÃO</option>
                    <option value="solicitacao">SOLICITAÇÃO</option>
                 </select>

                 <button class="btn-enviar">Enviar</button>
            </div>
        </div>
    </main>

    <footer>
        <nav>
            <div class="socials">

                <p>Redes Sociais</p>

                <div class="social-icons">
                
                    <a href="https://www.facebook.com/FordBrasil/?locale=pt_BR">
                        <img src="../img/facebook-50.png" alt="facebook">
                    </a>
                    <a href="https://www.youtube.com/fordbrasil">
                        <img src="../img/youtube-squared-50.png" alt="youtube">
                    </a>
                    <a href="https://www.instagram.com/fordbrasil/">
                        <img src="../img/instagram-logo-50.png" alt="instagram">
                    </a>

                </div>
                
            </div>

            <p>&copy; 2026 Ford. Todos os direitos reservados.</p>

            <div class="ford-logo-footer">
                <img src="../img/ford-96.png" alt="">
            </div>
        </nav>
    </footer>
</body>

</html>
